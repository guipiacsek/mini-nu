name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # only used by the release step, on version tags

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673

      - name: Run tests
        run: clojure -M:test

      - name: Build jar
        run: clojure -T:build uber

      - name: Run demo.sh against the jar
        run: |
          MINI_NU_DATA=mem java -jar target/mini-nu.jar &
          for i in $(seq 1 60); do curl -sf localhost:3000/accounts >/dev/null && break; sleep 1; done
          ./demo.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mini-nu-jar
          path: target/mini-nu.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/mini-nu.jar --title "$GITHUB_REF_NAME" --generate-notes
